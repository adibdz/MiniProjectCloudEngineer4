stages:
  - build
  - deploy

variables:
  # GitLab auto-fills these — DO NOT set them manually:
  # $CI_REGISTRY       = gitlab.homelab
  # $CI_REGISTRY_IMAGE = gitlab.homelab/adib/wibe-studio
  # $CI_REGISTRY_USER  = gitlab-ci-token
  # $CI_REGISTRY_PASSWORD = (auto per job)
  # $CI_COMMIT_SHORT_SHA  = e.g. a1b2c3d

  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
# ── BUILD + PUSH ──────────────────────────────────────────
build:
  stage: build
  # No 'image' needed here; it falls back to your default docker CLI image
  before_script:
    - echo "Logging in to $CI_REGISTRY"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building image $IMAGE"
    - docker build -t $IMAGE .
    - docker push $IMAGE
    - echo "Image pushed successfully"
  after_script:
    - docker logout $CI_REGISTRY
  only:
    - main

# ── DEPLOY TO K3S ───────────────────────────────────────
deploy:
  stage: deploy
  image: alpine/k8s:1.30.0
  before_script:
    - export KUBECONFIG=$KUBECONFIG
    - kubectl version --client
    - kubectl get nodes   # confirms runner can talk to k3s
  script:
    - echo "Deploying image $IMAGE to k3s"
    # Replace IMAGE_TAG placeholder in deployment manifest with real image
    - sed "s|IMAGE_TAG|$IMAGE|g" k3s_phase2_ci-cd/deployment.yaml | kubectl apply -f -
    # Apply service and hpa (these don't change between deploys)
    - kubectl apply -f k3s_phase2_ci-cd/service.yaml
    - kubectl apply -f k3s_phase2_ci-cd/hpa.yaml
    # Wait for rollout — pipeline fails if pods don't come up healthy
    - kubectl rollout status deployment/wibe-studio --timeout=600s
    - echo "Deploy complete. Pods:"
    - kubectl get pods -o wide
  only:
    - main