apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wibe-studio-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wibe-studio        # must match deployment name exactly
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50